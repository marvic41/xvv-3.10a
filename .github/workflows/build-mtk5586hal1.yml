name: Build & Deploy mtk5586hal1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-cpp-app .

      - name: Run Docker Container
        run: |
          docker run --rm my-cpp-app

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login to JFrog Artifactory
        run: |
          echo "$ARTIFACTORY_PASS" | docker login myjfrogrepo.jfrog.io -u "$ARTIFACTORY_USER" --password-stdin
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PASS: ${{ secrets.ARTIFACTORY_PASS }}

      - name: Push Docker Image to JFrog
        run: |
          docker tag my-cpp-app myjfrogrepo.jfrog.io/myrepo/my-cpp-app:latest
          docker push myjfrogrepo.jfrog.io/myrepo/my-cpp-app:latest
