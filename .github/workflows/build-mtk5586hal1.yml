name: Build mtk5586hal1

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install CMake
        run: sudo apt-get install cmake -y

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build
