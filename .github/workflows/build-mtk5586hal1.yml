name: Build & Deploy mtk5586hal1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t mtk5586hal1 .
      
      - name: Verify Docker Image Exists
        run: docker images

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to JFrog Artifactory
        run: |
          echo "$ARTIFACTORY_PASS" | docker login myjfrogrepo.jfrog.io -u "$ARTIFACTORY_USER" --password-stdin
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PASS: ${{ secrets.ARTIFACTORY_PASS }}

      - name: Push Docker Image to JFrog
        run: |
          docker tag mtk5586hal1 myjfrogrepo.jfrog.io/myrepo/mtk5586hal1:latest
          docker push myjfrogrepo.jfrog.io/myrepo/mtk5586hal1:latest
